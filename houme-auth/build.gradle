// houme-auth: SecurityConfig/JWT/CustomUserDetails
dependencies {
    implementation project(':houme-domain')
    implementation project(':houme-common')
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework:spring-web'
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    api 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis' // refresh/blacklist 토큰 저장
}
