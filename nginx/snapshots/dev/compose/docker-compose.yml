services:
  app:
    image: ${ECR_REGISTRY}:${IMAGE_TAG}
    container_name: houme
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_ENV: dev
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - houme-network

  redis:
    image: redis:7.2
    container_name: redis
    restart: always
    networks:
      - houme-network

networks:
  houme-network:
    name: houme-network
    driver: bridge
