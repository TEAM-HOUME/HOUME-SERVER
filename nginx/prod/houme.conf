# prod.houme.kr — 서버의 /etc/nginx/sites-available/houme.conf 로 배치
# dev 와 구조 100% 동일. 차이는 server_name·cert 경로·green 포트뿐이다.
# prod 는 blue(8080)/green(8081) 무중단 전환 구조다.

upstream blue  { server 127.0.0.1:8080; }
upstream green { server 127.0.0.1:8081; }

server {
    listen 80;
    listen [::]:80;
    server_name prod.houme.kr;

    # certbot 갱신/발급용
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name prod.houme.kr;

    ssl_certificate     /etc/letsencrypt/live/prod.houme.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prod.houme.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # blue/green 전환 상태 — CD 가 이 파일을 덮어쓰고 reload 한다
    include /etc/nginx/service-env.inc;

    location / {
        proxy_pass http://$service_url;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_redirect off;
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
