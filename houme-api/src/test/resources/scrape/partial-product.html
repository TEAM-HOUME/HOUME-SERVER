<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1인용 라운지 체어 - 예시몰</title>

    <!-- JSON-LD 에 이름과 가격만 있고 이미지가 없다.
         이미지는 OG 가 채워야 하며, 이름은 JSON-LD 값이 유지되어야 한다 (덮어쓰기 금지) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "라운지 체어 (JSON-LD)",
      "offers": { "price": "189000", "priceCurrency": "KRW" }
    }
    </script>

    <meta property="og:title" content="라운지 체어 (OG)">
    <meta property="og:image" content="https://cdn.example-mall.co.kr/images/chair-og.jpg">
    <meta property="product:brand" content="체어랩">
</head>
<body>
<h1>1인용 라운지 체어</h1>
</body>
</html>
