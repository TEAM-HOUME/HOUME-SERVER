// houme-api: 컨트롤러·advice·web/swagger config·main. 유일한 bootJar.
plugins {
    id 'org.springframework.boot'
    id 'com.google.cloud.tools.jib'
    id 'jacoco'
}

dependencies {
    implementation project(':houme-application')
    implementation project(':houme-auth')
    implementation project(':houme-common')
    runtimeOnly project(':houme-infra')
    implementation project(':houme-external')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'io.github.resilience4j:resilience4j-spring-boot3'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    implementation 'org.glassfish:jakarta.el:4.0.2'
    implementation 'io.sentry:sentry-spring-boot-starter-jakarta:7.9.0'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // 통합/슬라이스 테스트는 전부 여기 (전체 클래스패스 필요)
    testImplementation project(':houme-infra')
    testImplementation project(':houme-external')
    testImplementation project(':houme-domain')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.cloud:spring-cloud-starter-aws:2.2.6.RELEASE'
    testImplementation platform('software.amazon.awssdk:bom:2.25.20')
    testImplementation 'software.amazon.awssdk:s3'
    testImplementation "com.querydsl:querydsl-jpa:5.0.0:jakarta"
    testImplementation 'org.redisson:redisson-spring-boot-starter:3.27.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation project(':houme-common')
    testRuntimeOnly 'org.postgresql:postgresql:42.7.3'
    testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    // CI 환경에서 다수의 Spring 컨텍스트 + Jacoco로 인한 OOM을 완화하기 위해 HEAPsize를 줄임
    maxHeapSize = '3g'
    jvmArgs '-XX:MaxMetaspaceSize=1g'
    maxParallelForks = 1
    // forkEvery 제거: Testcontainers 와 fork 재기동이 충돌(Ryuk 셧다운 훅 hang)하고,
    // 단일 JVM 이어야 PG/Redis 컨테이너 1세트를 전체 테스트가 공유한다
    finalizedBy 'jacocoTestReport'
}

jacoco {
    toolVersion = '0.8.12'
}

jib {
    from {
        image = 'eclipse-temurin:21-jdk' // 베이스 이미지 지정
    }
    to {
        image = project.hasProperty('jibToImage') ? project.getProperty('jibToImage') : 'default/image'
        // runId 기반 태그 (ex: 16063719236) 와 latest 모두 추가
        tags = project.hasProperty('jibTag')
                ? [project.getProperty('jibTag')]
                : ['default']
        credHelper = 'ecr-login'
    }
    container {
        jvmFlags = ["-Xms512m", "-Xmx512m"]
        creationTime = "USE_CURRENT_TIMESTAMP"
        format = 'Docker'
    }
    // cwebp 실행파일을 도커 이미지에 포함 + 실행권한 부여
    // cwebp 바이너리: EC2가 t3.small -> libwebp 1.5.0 linux-x86-64 (amd64 static-pie)
    extraDirectories {
        paths {
            path {
                from = file('src/main/jib')
                into = '/'
            }
        }
        permissions = ['/app/bin/cwebp': '755']
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required.set(true)
        xml.required.set(true)
        csv.required.set(true)
        html.destination file("${project.layout.buildDirectory.get().asFile}/reports/jacoco/index/html")
        xml.destination file("${project.layout.buildDirectory.get().asFile}/reports/jacoco/index/jacoco.xml")
        csv.destination file("${project.layout.buildDirectory.get().asFile}/reports/jacoco/index/jacoco.csv")
    }

    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(dir: it, excludes: [
                            "or/sopt/houme/global/**",
                            "**/Q*.class"
                    ])
                })
        )
    }
}
