# dev EC2 에서 실행 — houme 컨테이너 로그를 모니터링 서버 Loki 로 전송
#   cd monitoring/dev && docker compose up -d
services:
  promtail:
    image: grafana/promtail:3.2.1
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/positions
    deploy:
      resources:
        limits:
          memory: 64m   # dev EC2(t2.micro, 1GB) — 제한 필수

  # dev 호스트 자원(CPU/디스크) 지표 노출 — 중앙 Prometheus(prod)가 VPC 내부로 스크랩
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    ports:
      - "9100:9100"   # SG 에서 모니터링 호스트(같은 SG)만 허용
    volumes:
      - /:/host:ro,rslave
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  promtail_positions:
