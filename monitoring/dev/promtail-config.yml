# dev EC2 — houme 컨테이너(JSON 로그) 수집 → 모니터링 서버(10.0.1.11) Loki
# 라벨 정책: 카디널리티 낮은 것만 라벨(app/env/level/container).
#   traceId 는 라벨이 아닌 본문 필드 — 검색은 LogQL `| json | traceId="xxx"` 로 한다.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://10.0.1.11:3100/loki/api/v1/push

scrape_configs:
  - job_name: houme-app
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: name
            values: ["houme"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - target_label: app
        replacement: houme
      - target_label: env
        replacement: dev
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
