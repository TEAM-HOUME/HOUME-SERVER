# Grafana provisioning 용 — 컨테이너의 /etc/grafana/provisioning/datasources/ 에 배치
# (수동 등록 시: Grafana UI > Connections > Data sources > Loki, URL http://houme-loki:3100
#  또는 http://<모니터링서버내부IP>:3100)
apiVersion: 1

datasources:
  - uid: loki
    name: Loki
    type: loki
    access: proxy
    url: http://houme-loki:3100
    isDefault: false
    editable: false
