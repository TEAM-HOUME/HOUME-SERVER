# prod EC2(모니터링 서버)에서 실행 — 로그 저장소
#   cd monitoring/prod/loki && docker compose up -d
services:
  loki:
    image: grafana/loki:2.9.8
    container_name: houme-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      # VPC 내부(앱 서버 promtail)에서만 접근 — 보안그룹에서 외부 차단 필수
      - "3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  loki_data:
