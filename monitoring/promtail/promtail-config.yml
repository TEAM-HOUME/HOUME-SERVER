# houme 앱 컨테이너(stdout JSON 로그) → Loki 수집 설정
# 라벨 정책: 카디널리티 낮은 것만 라벨(app/env/level/container).
#   traceId 는 라벨이 아닌 본문 필드 — 검색은 LogQL `| json | traceId="xxx"` 로 한다.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: ${LOKI_URL}/loki/api/v1/push

scrape_configs:
  - job_name: houme-app
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          # 앱 컨테이너만 수집: dev=houme, prod=blue/green
          - name: name
            values: ["houme", "blue", "green"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - target_label: app
        replacement: houme
      - target_label: env
        replacement: ${HOUME_ENV}
    pipeline_stages:
      # 앱 로그는 LogstashEncoder JSON — level 만 라벨로 승격
      - json:
          expressions:
            level: level
      - labels:
          level:
