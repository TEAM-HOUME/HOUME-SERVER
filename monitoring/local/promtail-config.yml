# 내 맥 — bootRun 출력 파일(logs/houme-local.log) 수집 → 로컬 stack 의 Loki
# 라벨 정책: 카디널리티 낮은 것만 라벨(app/env/level/container).
#   traceId 는 라벨이 아닌 본문 필드 — 검색은 LogQL `| json | traceId="xxx"` 로 한다.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://host.docker.internal:3100/loki/api/v1/push

# macOS Docker 바인드마운트는 fsnotify 이벤트가 누락되므로 폴링으로 강제
global:
  file_watch_config:
    min_poll_frequency: 1s
    max_poll_frequency: 5s

target_config:
  sync_period: 5s

scrape_configs:
  - job_name: houme-local
    static_configs:
      - targets: [localhost]
        labels:
          app: houme
          env: local
          container: bootrun
          __path__: /applog/houme-local.log
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
