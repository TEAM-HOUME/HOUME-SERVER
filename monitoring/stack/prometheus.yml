# HOUME 앱 메트릭 스크랩 — JVM(Micrometer) 대시보드의 데이터 소스
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 룰 발화 시 Alertmanager 로 전달 (같은 compose 네트워크의 서비스명)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# 알림 룰 파일 (rules/ 디렉토리 전체)
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: houme-prod
    metrics_path: /actuator/prometheus
    static_configs:
      # prod 앱 — 같은 호스트의 blue/green (호스트 포트 8080)
      - targets: ["172.17.0.1:8080", "172.17.0.1:8081"]   # blue/green
        labels:
          env: prod

  - job_name: houme-dev
    metrics_path: /actuator/prometheus
    static_configs:
      # dev 앱 — dev EC2 (VPC 내부 IP)
      - targets: ["10.0.1.217:8080"]
        labels:
          env: dev

  - job_name: node-exporter
    static_configs:
      # prod 호스트 — 같은 compose 네트워크의 node-exporter (stack 이 도는 prod EC2)
      - targets: ["node-exporter:9100"]
        labels:
          env: prod
      # dev 호스트 — dev EC2 (VPC 내부 IP, dev 의 node-exporter 컨테이너)
      - targets: ["10.0.1.217:9100"]
        labels:
          env: dev
